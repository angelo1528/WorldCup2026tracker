<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bracket — World Cup 2026</title>
<link rel="stylesheet" href="style.css" />
<style>
  /* ---- Bracket-specific styles, themed to match the site ---- */
  .bracket-head { padding: 0 2rem; margin-bottom: 0.5rem; }
  .bracket-sub {
    font-family: 'DM Sans', sans-serif; font-size: 0.9rem; color: #888;
    display: inline-flex; align-items: center; gap: 8px; padding: 0 2rem; margin-bottom: 1rem;
  }
  .bracket-sub .dot { width: 8px; height: 8px; border-radius: 50%; background: #888; }
  .bracket-sub.locked .dot { background: #4caf50; }
  .bracket-sub.error { color: #d98b84; }
  .bracket-sub.error .dot { background: #b0504a; }

  .bracket-legend {
    display: flex; gap: 1.25rem; flex-wrap: wrap; padding: 0 2rem; margin-bottom: 1.5rem;
    font-size: 0.78rem; color: #888; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .bracket-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  .sw-win { background: #c9a84c; }
  .sw-third { background: #8a6db8; }
  .sw-pending { background: #444; }

  .bracket {
    display: grid; grid-template-columns: 1fr 1fr; gap: 1rem 2rem; padding: 0 2rem 2rem;
  }
  .col h2 {
    font-family: 'Barlow Condensed', sans-serif; font-size: 1rem; font-weight: 700;
    color: #888; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 0.75rem;
  }

  .tie {
    background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px;
    margin-bottom: 0.75rem; overflow: hidden; position: relative;
    border-left: 3px solid #c9a84c; transition: border-color 0.2s;
  }
  .tie.has-third { border-left-color: #8a6db8; }
  .tie-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.5rem 1rem; background: #111; border-bottom: 1px solid #2a2a2a;
  }
  .tie-no {
    font-family: 'Barlow Condensed', sans-serif; font-size: 0.78rem; font-weight: 700;
    color: #c9a84c; text-transform: uppercase; letter-spacing: 1px;
  }
  .tie-venue { font-size: 0.72rem; color: #666; }

  .team { display: flex; align-items: center; gap: 0.75rem; padding: 0.7rem 1rem; }
  .team + .team { border-top: 1px solid #222; }
  .seed {
    font-family: 'Barlow Condensed', sans-serif; font-size: 0.72rem; font-weight: 700;
    color: #888; background: #111; border: 1px solid #2a2a2a; border-radius: 5px;
    padding: 3px 6px; min-width: 34px; text-align: center; letter-spacing: 0.5px;
  }
  .team.settled .seed { color: #c9a84c; border-color: #4a3f20; }
  .team.third .seed { color: #b39ddb; border-color: #3c3155; }
  .name {
    font-family: 'Barlow Condensed', sans-serif; font-size: 1.1rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.5px; color: #f0f0f0; flex: 1;
  }
  .name.placeholder { color: #777; font-style: italic; font-weight: 600; }

  .thirds {
    margin: 1rem 2rem 2rem; background: #1a1a1a; border: 1px solid #2a2a2a;
    border-radius: 16px; padding: 1.5rem;
  }
  .thirds h2 {
    font-family: 'Barlow Condensed', sans-serif; font-size: 1.4rem; font-weight: 700;
    color: #c9a84c; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.25rem;
  }
  .thirds .sub { color: #888; font-size: 0.85rem; margin-bottom: 1rem; }
  .trow {
    display: grid; grid-template-columns: 28px 1fr auto auto auto; gap: 0.75rem;
    align-items: center; padding: 0.5rem 0.6rem; border-radius: 8px; font-size: 0.9rem;
  }
  .trow.in { background: rgba(201, 168, 76, 0.07); }
  .trow.cut { opacity: 0.5; }
  .trow .rk {
    font-family: 'Barlow Condensed', sans-serif; color: #c9a84c; font-size: 0.85rem; font-weight: 700;
  }
  .trow .tm { font-weight: 600; color: #f0f0f0; }
  .trow .gp { color: #777; font-size: 0.78rem; }
  .trow .stat { color: #aaa; font-size: 0.82rem; }
  .cutline {
    height: 1px; margin: 0.5rem 0;
    background: repeating-linear-gradient(90deg, #c9a84c 0 8px, transparent 8px 16px);
  }

  @media (max-width: 768px) {
    .bracket { grid-template-columns: 1fr; padding: 0 1rem 1rem; gap: 0.5rem; }
    .bracket-head, .bracket-sub, .bracket-legend { padding: 0 1rem; }
    .thirds { margin: 1rem; }
  }
</style>
</head>
<body>

  <nav>
    <span class="nav-logo"> WC 2026</span>
    <div class="nav-links">
      <a href="index.html">Dashboard</a>
      <a href="standings.html">Standings</a>
      <a href="players.html">Players</a>
      <a href="bracket.html" class="active">Bracket</a>

  <main>
    <div class="bracket-head"><h1>Round of 32</h1></div>
    <div class="bracket-sub" id="status">
      <span class="dot"></span><span id="statusText">Loading…</span>
    </div>
    <div class="bracket-legend">
      <span><i class="swatch sw-win"></i>Group winner / runner-up</span>
      <span><i class="swatch sw-third"></i>Best third place</span>
      <span><i class="swatch sw-pending"></i>Not yet decided</span>
    </div>

    <div class="bracket">
      <div class="col" id="colL"></div>
      <div class="col" id="colR"></div>
    </div>

    <div class="thirds">
      <h2>Third-place race</h2>
      <p class="sub">Top eight qualify, ranked by points, then goal difference, then goals scored.</p>
      <div id="thirdsBody"></div>
    </div>
  </main>

 * bracket.js — Round of 32 "as it stands" engine for the 2026 World Cup.

 * Round of 32 slots using FIFA's Annex C combination table (all 495 rows,
 * verified complete). This is the same deterministic method broadcasters use.
 *
 * ── THE ONLY THING YOU CUSTOMISE ──────────────────────────────────────────
 * adaptStandings() below converts YOUR standings feed into the shape this
 * engine expects. Point it at your real field names once and you are done.
 * ───────────────────────────────────────────────────────────────────────────

  // ===========================================================================
  //
  // Engine expects an array of 12 groups, each:
  //   { group: "A", teams: [ { name, played, pts, gd, gf }, ... ] }
  // teams may be in any order; the engine sorts them.

  // `raw` is whatever your getStandings function / standings.js produces.
  function adaptStandings(raw) {
    // Accepts every shape this API has returned:
    //   A) raw.data = [ {group, teams:[{position,name,goals:"GF:GA",points}]} ]
    //   B) raw.data.groups = { A:[{team,gf,ga,gd,points}], B:[...] }

    // Normalises to: [ {group:"A", teams:[{name,position,played,pts,gd,gf}]} ]

    function parseGoals(g) {
      if (typeof g === "number") return { gf: g, ga: 0, gd: g };
      var s = String(g == null ? "" : g);
      var m = s.match(/(-?\d+)\s*[:\-\/]\s*(-?\d+)/);
      if (m) { var gf = +m[1], ga = +m[2]; return { gf: gf, ga: ga, gd: gf - ga }; }
      var n = parseInt(s, 10);
      return isNaN(n) ? { gf: 0, ga: 0, gd: 0 } : { gf: n, ga: 0, gd: n };
    }

    function mapTeam(t) {
      var pg = parseGoals(t.goals);
      return {
        name: t.name != null ? t.name : t.team,         // "name" or "team"
        position: (typeof t.position === "number") ? t.position
                 : (typeof t.rank === "number") ? t.rank : null,
        played: t.played,
        pts: (t.points != null) ? t.points : t.pts,
        gd: (typeof t.gd === "number") ? t.gd : pg.gd,
        gf: (typeof t.gf === "number") ? t.gf : pg.gf
      };
    }

    // Locate the standings payload wherever it lives.
    var d = (raw && raw.data != null) ? raw.data : raw;

    // Shape A / C-array: an array of group objects.
    if (Array.isArray(d)) {
      return d.map(function (grp) {
        return {
          group: String(grp.group || grp.name || "").replace(/^Group\s*/i, "").trim(),
          teams: (grp.teams || grp.standings || []).map(mapTeam)
        };
      });
    }

    // Shape B / C-object: groups keyed by letter.
    var groupsObj = (d && d.groups) || (raw && raw.groups) ||
                    (d && !Array.isArray(d) ? d : null);

      return Object.keys(groupsObj)
        .filter(function (k) { return Array.isArray(groupsObj[k]); })
        .map(function (letter) {
          return {
            group: String(letter).replace(/^Group\s*/i, "").trim(),
            teams: groupsObj[letter].map(mapTeam)
          };
        });
    }

  function sortGroup(teams) {
    // If the feed provides `position` (the API's own rank, which already

    var hasPos = teams.every(function (t) {
      return typeof t.position === "number";
    });
    if (hasPos) {
      return teams.slice().sort(function (x, y) { return x.position - y.position; });
    }
    return teams.slice().sort(function (x, y) {
      return (y.pts - x.pts) || (y.gd - x.gd) || (y.gf - x.gf);
    });

  function computeBracket(rawStandings) {
    var groups = adaptStandings(rawStandings);
    var byLetter = {};
    var thirds = [];
    var allComplete = true;
    var nameToGroup = {}; // "Scotland" -> "C", for the API ranking lookup

    groups.forEach(function (g) {
      var sorted = sortGroup(g.teams);
      byLetter[g.group] = {
        "1": sorted[0] || null,
        "2": sorted[1] || null,
        "3": sorted[2] || null
      };
      sorted.forEach(function (t) {
        if (t && t.name) nameToGroup[t.name] = g.group;
      });
      // a group is "final" only when every team has played all 3 games
      var done = g.teams.length === 4 && g.teams.every(function (t) {
        return (t.played || 0) >= 3;
      });
      if (!done) allComplete = false;
      if (sorted[2]) {
        thirds.push({
          group: g.group,
          team: sorted[2].name,
          pts: sorted[2].pts,
          gd: sorted[2].gd,
          gf: sorted[2].gf,
          groupComplete: done

    });

    // (already sorted by the official tiebreakers, with status q1 = in).
    var rankedThirds;
    var apiRank = rawStandings && rawStandings.thirdPlacedRanking &&
                  rawStandings.thirdPlacedRanking.teams;

          if (m) return { gf: +m[1], gd: (+m[1]) - (+m[2]) };
          return { gf: 0, gd: 0 };
        })(t.goals);
        return {
          group: nameToGroup[t.name] || "",
          team: t.name,
          pts: t.points,
          gd: pg.gd,
          gf: pg.gf,
          qualifying: t.status === "q1"  // API's own in/out flag
        };
      }).filter(function (t) { return t.group; });
    } else {
      // Fallback: derive ranking ourselves from the group tables.
      rankedThirds = thirds.slice().sort(function (x, y) {
        return (y.pts - x.pts) || (y.gd - x.gd) || (y.gf - x.gf);
      });
    }

    var best8 = rankedThirds.slice(0, 8);
    var best8Letters = best8.map(function (t) { return t.group; }).sort();

    // "As it stands": place the eight current qualifying thirds into their
    // real slots via Annex C on every refresh, exactly as if the group stage
    // ended right now. We still track whether the stage is actually complete
    // so the status line can say "final" vs "projected".
    var thirdAssign = null; // map: winnerSlot -> third group letter
    var projected = best8.length === 8 && best8Letters.length === 8;
    if (projected) {
      var key = best8Letters.join("");
      var row = ANNEX_C[key];
      if (row) {
        thirdAssign = {};
        ANNEX_SLOTS.forEach(function (slot, i) {
          thirdAssign[slot] = row[i]; // letter
        });
      }
    }
    var locked = allComplete && !!thirdAssign;

    function resolve(code) {
      // returns { label, team, settled }
      if (code.charAt(0) === "3") {
        // third-place placeholder like "3:ABCDF"
        var setStr = code.split(":")[1];
        if (thirdAssign) {
          // find which group-winner slot this match belongs to — handled by caller
          return null; // resolved per-match below
        }
        return { label: "3rd " + setStr.split("").join("/"), team: null, settled: false };
      }
      var pos = code.charAt(0);     // "1" or "2"
      var letter = code.charAt(1);  // group letter
      var slot = byLetter[letter];
      var t = slot ? slot[pos] : null;
      var posWord = pos === "1" ? "Winner" : "Runner-up";
      return {
        code: pos + letter,            // e.g. "1A", "2B"
        kind: "wr",                    // winner-or-runnerup
        label: posWord + " " + letter,
        team: t ? t.name : null,
        settled: !!t
      };
    }

    var out = MATCHES.map(function (match) {
      var a = resolve(match.a);
      var b;
      if (match.b.charAt(0) === "3") {
        if (thirdAssign && thirdAssign[match.a]) {
          var letter = thirdAssign[match.a];
          var t = byLetter[letter] ? byLetter[letter]["3"] : null;
          b = {
            code: "3" + letter,
            kind: "third",
            label: "3rd " + letter,
            team: t ? t.name : null,
            settled: !!t

        } else {
          var setStr = match.b.split(":")[1];
          b = {
            code: "3·" + setStr,
            kind: "third",
            label: "3rd " + setStr.split("").join("/"),
            team: null,
            settled: false
          };
        }
      } else {
        b = resolve(match.b);
      }
      return {
        match: match.m,
        side: match.side,
        home: a,
        away: b
      };
    });

    return {
      matches: out,
      thirdsRanked: rankedThirds,
      best8: best8,
      projected: !!thirdAssign, // thirds currently placed into slots
      locked: locked,           // placement is final (all groups complete)
      allGroupsComplete: allComplete

<script>
/* ----------------------------------------------------------------------------
 * Live data only. Reads your getStandings function, computes the Round of 32
 * "as it stands", and refreshes every 30 minutes. No hardcoded teams.
 * -------------------------------------------------------------------------- */

// Your Netlify data function (NOT the /standings page, which returns HTML).
const STANDINGS_URL = "/.netlify/functions/getStandings";
const REFRESH_MS = 30 * 60 * 1000; // 30 minutes

const VENUES = {
  73:"Los Angeles",74:"Boston",75:"Guadalajara",76:"Monterrey",77:"East Rutherford",
  78:"Arlington",79:"Mexico City",80:"Vancouver",81:"Santa Clara",82:"Seattle",
  83:"Philadelphia",84:"Houston",85:"Atlanta",86:"Miami",87:"Kansas City",88:"Dallas"
};

function teamRow(slot){
  const isThird = slot.kind === "third";
  const cls = isThird ? "third" : (slot.settled ? "settled" : "");
  const display = slot.team
    ? `<span class="name">${slot.team}</span>`
    : `<span class="name placeholder">${slot.label}</span>`;
  return `<div class="team ${cls}">
    <span class="seed">${slot.code}</span>
    ${display}
  </div>`;
}

function tieCard(m){
  const hasThird = m.home.kind === "third" || m.away.kind === "third";
  return `<div class="tie ${hasThird ? "has-third":""}">
    <div class="tie-head">
      <span class="tie-no">Match ${m.match}</span>
      <span class="tie-venue">${VENUES[m.match]||""}</span>
    </div>
    ${teamRow(m.home)}
    ${teamRow(m.away)}
  </div>`;
}

function renderThirds(ranked){
  const body = document.getElementById("thirdsBody");
  if (!ranked.length){ body.innerHTML = `<p class="sub">No third-place data yet.</p>`; return; }
  let html = "";
  ranked.forEach((t,i)=>{
    const rank = i+1, inCut = rank<=8;
    html += `<div class="trow ${inCut?"in":"cut"}">
      <span class="rk">${rank}</span>
      <span class="tm">${t.team} <span class="gp">\u00b7 Grp ${t.group}</span></span>
      <span class="stat">${t.pts} pts</span>
      <span class="stat">GD ${t.gd>=0?"+":""}${t.gd}</span>
      <span class="stat">GF ${t.gf}</span>
    </div>`;
    if (rank===8) html += `<div class="cutline"></div>`;
  });
  body.innerHTML = html;
}

function render(standings){
  const res = WCBracket.compute(standings);
  const L = res.matches.filter(m=>m.side==="L");
  const R = res.matches.filter(m=>m.side==="R");
  document.getElementById("colL").innerHTML = `<h2>Left half</h2>` + L.map(tieCard).join("");
  document.getElementById("colR").innerHTML = `<h2>Right half</h2>` + R.map(tieCard).join("");
  renderThirds(res.thirdsRanked);

  const st = document.getElementById("status");
  const txt = document.getElementById("statusText");
  st.classList.remove("error");
  if (res.locked){
    st.classList.add("locked");
    txt.textContent = "Final \u2014 group stage complete";
  } else {
    st.classList.remove("locked");
    txt.textContent = res.projected
      ? "As it stands \u00b7 projected if groups ended now "
      : "If the group stage ended now \u00b7 updates every 30 min";
  }
}

function showError(msg){
  const st = document.getElementById("status");
  const txt = document.getElementById("statusText");
  st.classList.add("error"); st.classList.remove("locked");
  txt.textContent = msg;
}

async function refresh(){
  try {
    const r = await fetch(STANDINGS_URL);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    render(data);
  } catch (e) {
    showError("Couldn\u2019t load standings (" + e.message + ") \u2014 retrying next cycle");
    console.error("bracket: standings fetch failed", e);
  }
}

refresh();
setInterval(refresh, REFRESH_MS);
</script>
